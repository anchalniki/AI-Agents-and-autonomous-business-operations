<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SegmentIQ AI</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#f4f6f9;--card:#fff;--tx:#0b2545;--mu:#5b6b7f;--ac:#1d5fd6;--tl:#0f8fa0;--bd:#dde3ea}
*{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif;background:var(--bg);color:var(--tx);display:flex;min-height:100vh}
nav{width:220px;background:#0b2545;color:#fff;padding:14px 8px;flex-shrink:0}nav h1{font-size:17px;margin:4px 8px}nav small{display:block;margin:0 8px 12px;color:#9fd8e0;font-size:11px}
nav button{display:block;width:100%;text-align:left;background:none;border:0;color:#cfd8e6;padding:9px 10px;border-radius:6px;cursor:pointer;font:inherit}nav button.on,nav button:hover{background:#1d5fd6;color:#fff}
main{flex:1;padding:16px;min-width:0}.note{background:#e8f4f6;border:1px solid #b6dde3;padding:8px 12px;border-radius:6px;font-size:12px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:12px;margin-bottom:12px;overflow-x:auto}.g{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.k{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:12px}
.k div{background:var(--card);border:1px solid var(--bd);border-left:4px solid var(--tl);border-radius:8px;padding:10px}.k b{font-size:20px;display:block}.k span{color:var(--mu);font-size:12px}
table{border-collapse:collapse;width:100%;font-size:12px}th,td{padding:5px 8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}th{cursor:pointer;color:var(--mu)}tr.c:hover{background:#eef4ff;cursor:pointer}
.br{display:flex;align-items:center;gap:6px;margin:3px 0;font-size:12px}.br i{width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-style:normal}.br u{display:block;height:14px;background:var(--tl);border-radius:3px;min-width:2px}
select,input,button.b{font:inherit;padding:5px 8px;border:1px solid var(--bd);border-radius:6px;background:#fff;color:var(--tx)}button.b{background:var(--ac);color:#fff;cursor:pointer;border-color:var(--ac);margin:3px}
label{font-size:12px;color:var(--mu);margin-right:8px}h2{margin:4px 0 10px}h3{margin:0 0 8px;font-size:14px}.w{color:#9a5b00}.er{color:#b00020}
@media(prefers-color-scheme:dark){:root{--bg:#0d1520;--card:#162233;--tx:#e6edf6;--mu:#93a4b8;--bd:#2a3a50}select,input{background:#0d1520}.note{background:#12303a;border-color:#245}}
@media print{nav,.nf{display:none}body{display:block}}
</style></head><body>
<nav><h1>SegmentIQ AI</h1><small>Understand Behavior. Discover Segments. Personalize Growth.</small><div id="nv"></div></nav>
<main><div class="note">Prototype demonstration — customer records, segment profiles, and campaign recommendations use illustrative sample data unless otherwise stated.</div><div id="err" class="er"></div><div id="fb" class="nf"></div><div id="pg"></div></main>
<script>
const $=s=>document.querySelector(s),sum=a=>a.reduce((x,y)=>x+y,0),avg=a=>a.length?sum(a)/a.length:0,dn=s=>Date.parse(s)/864e5,iso=d=>new Date(d*864e5).toISOString().slice(0,10);
const f0=n=>Math.round(n).toLocaleString(),f1=n=>(+n).toFixed(1),pc=n=>(n*100).toFixed(1)+'%',cur=n=>'$'+f0(n);
const rng=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const CATS=['Apparel','Electronics','Home','Beauty','Grocery'],REG=['North','South','East','West'],CH=['Organic','Paid Search','Social','Referral','Email'],AGE=['18-24','25-34','35-44','45-54','55+'];
// ---------- synthetic data (seed 20261028): customers + transactions + interaction summaries
function gen(){const r=rng(20261028),ri=(a,b)=>a+Math.floor(r()*(b-a+1)),pk=a=>a[Math.floor(r()*a.length)],B=Date.UTC(2025,10,1)/864e5;
const A=[[.2,[14,24],120,.1,.04,0,20,.6,12,1],[.2,[6,12],45,.8,.1,0,8,.35,3,2],[.25,[1,3],70,.3,.06,0,3,.15,1,1],[.15,[5,9],80,.3,.08,180,2,.08,.5,3],[.2,[8,14],60,.3,.05,0,30,.5,25,1]];
const T=[],info={};let tn=0;
for(let i=1;i<=1000;i++){let u=r(),ai=0,c=0;for(;ai<4;ai++){c+=A[ai][0];if(u<c)break}const a=A[ai],id='C'+String(i).padStart(4,'0'),n=ri(...a[1]),w=a[5]||364,pref=pk(CATS);let first=1e9;
for(let j=0;j<n;j++){const d=B+ri(0,w),ds=r()<a[3];first=Math.min(first,d);T.push({id:'T'+String(++tn).padStart(6,'0'),cid:id,date:iso(d),cat:r()<.6?pref:pk(CATS),amt:Math.round(Math.max(8,a[2]*(.5+r()))*(ds?.8:1)),disc:ds?1:0,ret:r()<a[4]?1:0})}
info[id]={age:pk(AGE),region:pk(REG),channel:pk(CH),signup:iso(first-ri(1,300)),loyal:ai==0?r()<.8:r()<.2,web:Math.round(a[6]*(.6+r()*.8)),email:Math.min(1,a[7]*(.6+r()*.8)),app:Math.round(a[8]*(.6+r()*.8)),support:ri(0,a[9]*2)}}
return{T,info}}
// ---------- metrics derived from transactions
function stats(T,ref){const m={};for(const t of T){const s=m[t.cid]||(m[t.cid]={n:0,spend:0,disc:0,ret:0,last:0,cats:{}});s.n++;s.spend+=t.amt;s.disc+=t.disc;s.ret+=t.ret;s.last=Math.max(s.last,dn(t.date));s.cats[t.cat]=(s.cats[t.cat]||0)+1}
for(const id in m){const s=m[id];s.aov=s.spend/s.n;s.dr=s.disc/s.n;s.rr=s.ret/s.n;s.rec=Math.round(ref-s.last);s.div=Object.keys(s.cats).length}return m}
const eng=i=>i.web==null?null:100*(.3*Math.min(i.web/30,1)+.4*i.email+.3*Math.min(i.app/25,1));
const NI={region:'Unknown',channel:'Unknown',age:'Unknown',web:null,email:null,app:null,support:null,loyal:null};
// ---------- K-means (k-means++ init, seeded)
function km(X,k,seed){const r=rng(seed),n=X.length,D=(a,b)=>a.reduce((s,v,i)=>s+(v-b[i])**2,0);let C=[X[Math.floor(r()*n)].slice()];
while(C.length<k){const ds=X.map(x=>Math.min(...C.map(c=>D(x,c))));let t=r()*sum(ds),i=0;for(;i<n-1&&(t-=ds[i])>0;i++);C.push(X[i].slice())}
const L=new Array(n).fill(-1);for(let it=0;it<80;it++){let ch=0;X.forEach((x,i)=>{let b=0,bd=1e18;C.forEach((c,j)=>{const v=D(x,c);if(v<bd){bd=v;b=j}});if(L[i]!==b){L[i]=b;ch++}});if(!ch)break;
C=C.map((c,j)=>{const m=X.filter((_,i)=>L[i]===j);return m.length?c.map((_,q)=>avg(m.map(x=>x[q]))):c})}return{L,C}}
const FE=['Recency','Frequency(log)','Spend(log)','Avg order value','Discount rate','Return rate','Engagement','Category diversity'];
function labelOf(z){const[rec,fr,mo,ao,di,re,en]=z;if(mo>.5&&fr>.3&&rec<.3)return['loyal','High-Value Loyal Customers'];if(en>.7)return['digital','Frequent Digital Shoppers'];if(di>.7)return['discount','Discount-Driven Buyers'];if(fr<-.5)return['occasional','Occasional Customers'];if(rec>.3)return['inactive','Recently Inactive Customers'];return['mixed','Mixed-Behavior Customers']}
const PB={loyal:{obj:'Retain and grow share of wallet',camp:'Loyalty rewards, early access to new products, complementary cross-sell, VIP recognition',ch:'Email, app push',pri:'High',met:'Repeat rate, spend per customer',lim:'Rewards may subsidise purchases that would occur anyway',fq:'2–3 contacts/month',th:'Recognition, early access',risk:'Over-contact; reward cost without incrementality',hyp:'May value recognition and convenience over price',act:'Offer early access / VIP perk'},
digital:{obj:'Increase app-led repeat purchase',camp:'App-based recommendations, personalised browsing, relevant digital campaigns',ch:'App, web, email',pri:'Medium',met:'App conversion rate, orders per active user',lim:'Engagement may not convert to spend',fq:'Weekly',th:'Relevance, new arrivals',risk:'Notification fatigue',hyp:'May respond to in-app personalisation',act:'Send app recommendations'},
discount:{obj:'Protect margin while retaining volume',camp:'Targeted promotion tests; measure incremental profit not volume; avoid discounts where purchases would occur anyway',ch:'Email, SMS',pri:'Medium',met:'Incremental gross profit per customer',lim:'Needs holdout group to measure incrementality',fq:'1–2/month, event-led',th:'Value, bundles',risk:'Margin erosion, trained discount expectation',hyp:'May wait for promotions',act:'Test a capped, targeted offer with holdout'},
occasional:{obj:'Raise purchase frequency',camp:'Personalised recommendations, category emails, reminders based on purchase history',ch:'Email',pri:'Medium',met:'Second-purchase rate, 90-day frequency',lim:'Low purchase history limits personalisation',fq:'1–2/month',th:'Relevant products, reminders',risk:'Low response to generic messages',hyp:'Purchases may be need-driven',act:'Send category-based reminder'},
inactive:{obj:'Win back lapsed customers',camp:'Win-back campaign, tailored reminders; suppress after repeated non-response',ch:'Email, SMS',pri:'High',met:'Reactivation rate, net contribution',lim:'Some lapses are permanent; incentives may be unnecessary',fq:'2–3 touches then suppress',th:'We miss you, what is new',risk:'Spam complaints, wasted incentive',hyp:'Reasons for lapse are unknown from this data',act:'Win-back message, then suppress if no response'},
mixed:{obj:'Learn what drives value',camp:'Controlled tests across offers and channels',ch:'Email',pri:'Low',met:'Response rate by test cell',lim:'Segment is not distinctive',fq:'1/month',th:'General relevance',risk:'Diffuse messaging',hyp:'None supported by data',act:'Include in A/B tests'}};
// ---------- state & pipeline
const S={k:5,f:{},rfm:{r:[30,90,180],f:[2,5,10],m:[200,600,1500]},page:'ov',sim:{},pend:null,sel:null,sort:['spend',-1],q:''};
function load(T,info){S.T=T;S.info=info;analyze()}
function analyze(){S.ref=Math.max(...S.T.map(t=>dn(t.date)))+1;const st=stats(S.T,S.ref);S.all=Object.keys(st).map(id=>({id,...NI,...S.info[id],...st[id]}));S.all.forEach(c=>c.eng=eng(c));S.byId={};S.all.forEach(c=>S.byId[c.id]=c);S.segs=[];S.warn=[];
if(S.all.length<S.k*5){S.all.forEach(c=>c.seg='Unsegmented');S.warn.push('Too few customers for k='+S.k+' (need ≥ '+S.k*5+'). Segmentation skipped.');return}
const me=avg(S.all.filter(c=>c.eng!=null).map(c=>c.eng));const R=S.all.map(c=>[c.rec,Math.log1p(c.n),Math.log1p(c.spend),c.aov,c.dr,c.rr,c.eng==null?me:c.eng,c.div]);
if(S.all.some(c=>c.eng==null))S.warn.push('Missing interaction fields: engagement imputed with the mean for clustering.');
const mu=R[0].map((_,j)=>avg(R.map(r=>r[j]))),sd=R[0].map((_,j)=>Math.sqrt(avg(R.map(r=>(r[j]-mu[j])**2)))||1),X=R.map(r=>r.map((v,j)=>(v-mu[j])/sd[j]));
const{L,C}=km(X,S.k,42),used={};S.segs=C.map((z,i)=>{let[key,name]=labelOf(z);used[name]=(used[name]||0)+1;if(used[name]>1)name+=' ('+String.fromCharCode(64+used[name])+')';return{id:i,key,name,z}});
S.all.forEach((c,i)=>c.seg=S.segs[L[i]].name);S.segs.forEach(s=>{const n=L.filter(l=>l==s.id).length;if(n<.03*S.all.length)S.warn.push(s.name+' has under 3% of customers — consider fewer clusters.')})}
const rs=c=>{const p=S.rfm,R=c.rec<=p.r[0]?4:c.rec<=p.r[1]?3:c.rec<=p.r[2]?2:1,F=c.n>=p.f[2]?4:c.n>=p.f[1]?3:c.n>=p.f[0]?2:1,M=c.spend>=p.m[2]?4:c.spend>=p.m[1]?3:c.spend>=p.m[0]?2:1,t=R+F+M;
return{R,F,M,grp:t>=10?'Champions':R>=3&&F>=2?'Loyal / Active':R<=2&&F>=3?'At-Risk':R==1?'Lost':'Potential / Low-Engagement'}};
function view(){const f=S.f;let T=S.T.filter(t=>(!f.from||t.date>=f.from)&&(!f.to||t.date<=f.to)&&(!f.cat||t.cat===f.cat));
const ok=new Set(S.all.filter(c=>(!f.region||c.region===f.region)&&(!f.ch||c.channel===f.ch)&&(!f.seg||c.seg===f.seg)).map(c=>c.id));T=T.filter(t=>ok.has(t.cid));const st=stats(T,S.ref);
const C=Object.keys(st).map(id=>{const o=S.byId[id],c={...o,...st[id]};Object.assign(c,rs(c));return c});return{T,C}}
function agg(V){const m={};V.C.forEach(c=>(m[c.seg]=m[c.seg]||[]).push(c));const tot=sum(V.C.map(c=>c.spend))||1;
return Object.keys(m).map(name=>{const a=m[name],rev=sum(a.map(c=>c.spend)),cats={};a.forEach(c=>{for(const k in c.cats)cats[k]=(cats[k]||0)+c.cats[k]});const sg=S.segs.find(s=>s.name==name);
const e=a.filter(c=>c.eng!=null).map(c=>c.eng);return{name,key:sg?sg.key:'mixed',z:sg?sg.z:[],n:a.length,share:a.length/V.C.length,rev,rs:rev/tot,aov:rev/sum(a.map(c=>c.n)),fq:avg(a.map(c=>c.n)),rec:avg(a.map(c=>c.rec)),dr:avg(a.map(c=>c.dr)),rr:avg(a.map(c=>c.rr)),eng:e.length?avg(e):null,rep:a.filter(c=>c.n>=2).length/a.length,top:Object.entries(cats).sort((x,y)=>y[1]-x[1]).slice(0,3).map(x=>x[0]).join(', '),a}}).sort((x,y)=>y.rev-x.rev)}
function kp(V,A){const t=V.C.length;if(!t)return null;const sp=V.C.map(c=>c.spend).sort((a,b)=>a-b),p80=sp[Math.floor(.8*(t-1))];return{t,ns:A.length,av:sum(sp)/t,rep:V.C.filter(c=>c.n>=2).length/t,hv:V.C.filter(c=>c.spend>=p80).length/t,rk:V.C.filter(c=>c.grp=='At-Risk'||c.grp=='Lost').length/t}}
const evid=s=>`${s.name}: ${pc(s.share)} of customers, ${pc(s.rs)} of revenue, AOV ${cur(s.aov)}, ${f1(s.fq)} orders, recency ${f0(s.rec)}d, discount ${pc(s.dr)}, engagement ${s.eng==null?'n/a':f0(s.eng)}`;
const dist=s=>s.z.map((v,i)=>Math.abs(v)>.5?(v>0?'Higher ':'Lower ')+FE[i].toLowerCase()+' than average':null).filter(Boolean).join('; ')||'No strong deviations';
// ---------- UI helpers
const bars=(rows,fm)=>{const m=Math.max(...rows.map(r=>r[1]),1e-9);return rows.map(([l,v])=>`<div class="br"><i title="${l}">${l}</i><u style="width:${Math.max(2,v/m*55)}%"></u><span>${fm(v)}</span></div>`).join('')};
const tbl=(h,r)=>`<table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.map(x=>`<tr>${x.map(y=>`<td>${y}</td>`).join('')}</tr>`).join('')}</table>`;
const dl=(n,txt,mime)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:mime||'text/csv'}));a.download=n;a.click()};
const sel=(id,o,v)=>`<select id="${id}" onchange="fc('${id}',this.value)"><option value="">All</option>${o.map(x=>`<option ${x==v?'selected':''}>${x}</option>`).join('')}</select>`;
function fc(id,v){S.f[id]=v;render()}
const PG=[['ov','Executive Overview'],['ex','Customer Explorer'],['sg','Behavioral Segmentation'],['pr','Segment Profiles'],['rf','Customer Value & RFM'],['st','Marketing Strategy'],['sm','Campaign Simulator'],['dm','Data Management'],['xp','Export & Reports']];
const go=p=>{S.page=p;render()};
function render(){try{$('#err').textContent='';$('#nv').innerHTML=PG.map(([k,n])=>`<button class="${k==S.page?'on':''}" onclick="go('${k}')">${n}</button>`).join('');
const nf=['dm','xp','sm'].includes(S.page)?'':`<div class="card"><label>From <input type="date" value="${S.f.from||''}" onchange="fc('from',this.value)"></label><label>To <input type="date" value="${S.f.to||''}" onchange="fc('to',this.value)"></label><label>Category ${sel('cat',CATS,S.f.cat)}</label><label>Region ${sel('region',[...new Set(S.all.map(c=>c.region))],S.f.region)}</label><label>Channel ${sel('ch',[...new Set(S.all.map(c=>c.channel))],S.f.ch)}</label><label>Segment ${sel('seg',S.segs.map(s=>s.name),S.f.seg)}</label><button class="b" onclick="S.f={};render()">Reset</button></div>`;
$('#fb').innerHTML=nf;const V=view(),A=agg(V);$('#pg').innerHTML=(S.warn.length?`<div class="card w">${S.warn.join('<br>')}</div>`:'')+(V.C.length||!nf?P[S.page](V,A):'<div class="card">No customers match the current filters or data. Adjust filters or load data.</div>');if(S.page=='ex')tb()}catch(e){$('#err').textContent='Render error: '+e.message;console.error(e)}}
const P={};
P.ov=(V,A)=>{const k=kp(V,A);return`<h2>Executive Overview</h2><div class="k"><div><b>${f0(k.t)}</b><span>Total customers</span></div><div><b>${k.ns}</b><span>Behavioral segments</span></div><div><b>${cur(k.av)}</b><span>Avg customer value</span></div><div><b>${pc(k.rep)}</b><span>Repeat purchase rate</span></div><div><b>${pc(k.hv)}</b><span>High-value share (top 20% spend)</span></div><div><b>${pc(k.rk)}</b><span>At-risk / lost share (RFM)</span></div></div>
<div class="g"><div class="card"><h3>Customers by segment</h3>${bars(A.map(s=>[s.name,s.n]),f0)}</div><div class="card"><h3>Revenue by segment</h3>${bars(A.map(s=>[s.name,s.rev]),cur)}</div><div class="card"><h3>Average order value</h3>${bars(A.map(s=>[s.name,s.aov]),cur)}</div><div class="card"><h3>Purchase frequency (orders/customer)</h3>${bars(A.map(s=>[s.name,s.fq]),f1)}</div><div class="card"><h3>Engagement score (0–100)</h3>${bars(A.map(s=>[s.name,s.eng||0]),f0)}</div></div><div class="card"><h3>Segment comparison</h3>${cmp(A)}</div>`};
const cmp=A=>tbl(['Segment','Customers','Share','Revenue','Rev %','AOV','Orders','Recency d','Discount','Return','Engagement','Repeat'],A.map(s=>[s.name,f0(s.n),pc(s.share),cur(s.rev),pc(s.rs),cur(s.aov),f1(s.fq),f0(s.rec),pc(s.dr),pc(s.rr),s.eng==null?'n/a':f0(s.eng),pc(s.rep)]));
P.ex=V=>`<h2>Customer Explorer</h2><div class="card"><input id="qs" placeholder="Search customer ID or segment" value="${S.q}" oninput="S.q=this.value;tb()"> <span id="dt"></span></div><div class="card" id="tbw"></div><div id="det"></div>`;
function tb(){const V=view(),q=S.q.toLowerCase();let r=V.C.filter(c=>!q||(c.id+c.seg+c.grp).toLowerCase().includes(q));const[k,d]=S.sort;r.sort((a,b)=>(a[k]>b[k]?1:a[k]<b[k]?-1:0)*d);
const H=[['id','Customer'],['seg','Segment'],['grp','RFM group'],['spend','Spend'],['aov','AOV'],['n','Orders'],['rec','Recency d'],['dr','Discount'],['eng','Engagement']];
$('#tbw').innerHTML=`<p>${f0(r.length)} customers (showing 200)</p><table><tr>${H.map(([k,n])=>`<th onclick="S.sort=['${k}',S.sort[0]=='${k}'?-S.sort[1]:-1];tb()">${n}</th>`).join('')}<th>Recommended action</th></tr>${r.slice(0,200).map(c=>`<tr class="c" onclick="S.sel='${c.id}';det()"><td>${c.id}</td><td>${c.seg}</td><td>${c.grp}</td><td>${cur(c.spend)}</td><td>${cur(c.aov)}</td><td>${c.n}</td><td>${c.rec}</td><td>${pc(c.dr)}</td><td>${c.eng==null?'n/a':f0(c.eng)}</td><td>${(PB[(S.segs.find(s=>s.name==c.seg)||{}).key]||PB.mixed).act}</td></tr>`).join('')}</table>`;det()}
function det(){const el=$('#det');if(!el||!S.sel||!S.byId[S.sel]){return}const c=view().C.find(x=>x.id==S.sel)||S.byId[S.sel],pb=PB[(S.segs.find(s=>s.name==c.seg)||{}).key]||PB.mixed,t=S.T.filter(x=>x.cid==c.id).sort((a,b)=>b.date>a.date?1:-1).slice(0,8);
el.innerHTML=`<div class="card"><h3>${c.id} — ${c.seg}</h3><p>RFM: ${c.grp} · Region ${c.region} · Channel ${c.channel} · Age band ${c.age}</p><p>Transactions: ${c.n}, spend ${cur(c.spend)}, AOV ${cur(c.aov)}, last purchase ${f0(c.rec)} days ago, discount use ${pc(c.dr)}, returns ${pc(c.rr)}</p><p>Interactions: web visits ${c.web??'n/a'}, email engagement ${c.email==null?'n/a':pc(c.email)}, app use ${c.app??'n/a'}, support contacts ${c.support??'n/a'}, loyalty ${c.loyal==null?'n/a':c.loyal?'member':'non-member'}</p><p><b>Recommendation:</b> ${pb.act}. Channel: ${pb.ch}.</p>${tbl(['Date','Category','Amount','Discounted','Returned'],t.map(x=>[x.date,x.cat,cur(x.amt),x.disc?'Y':'N',x.ret?'Y':'N']))}</div>`}
P.sg=(V,A)=>`<h2>Behavioral Segmentation</h2><div class="card"><b>Method:</b> K-means (k-means++ init, fixed seed 42, ≤80 iterations) on ${FE.length} z-scored features: ${FE.join(', ')}. Frequency and spend are log-transformed. Missing engagement is mean-imputed. IDs, demographics, signup date and acquisition channel are excluded. Segment names are assigned by rules applied to computed centroid values. Clusters are fit on the full loaded dataset; filters only change what is displayed.<br><label>Clusters (k) <input type="number" min="2" max="8" value="${S.k}" style="width:60px" onchange="S.k=+this.value;analyze();render()"></label></div>
<div class="card"><h3>Cluster centroids (z-scores; + means above average)</h3>${tbl(['Segment',...FE],S.segs.map(s=>[s.name,...s.z.map(v=>f1(v))]))}</div><div class="card"><h3>Segment sizes</h3>${bars(A.map(s=>[s.name,s.n]),f0)}</div>`;
P.pr=(V,A)=>`<h2>Segment Profiles</h2>${A.map(s=>{const p=PB[s.key];return`<div class="card"><h3>${s.name}</h3><p>${evid(s)}. Repeat rate ${pc(s.rep)}. Top categories: ${s.top}.</p><p><b>Distinguishing behaviors:</b> ${dist(s)}.</p><p><b>Hypothesis (not validated):</b> ${p.hyp}.</p><p><b>Opportunity:</b> ${p.obj}. <b>Risk:</b> ${p.risk}. <b>Channels:</b> ${p.ch}. <b>Contact:</b> ${p.fq}. <b>Message themes:</b> ${p.th}.</p></div>`}).join('')}<div class="card"><h3>Comparison</h3>${cmp(A)}</div><p class="note">Profiles generated by the local rule-based engine from computed metrics; no LLM is connected.</p>`;
P.rf=(V,A)=>{const G=['Champions','Loyal / Active','Potential / Low-Engagement','At-Risk','Lost'],g=G.map(n=>{const a=V.C.filter(c=>c.grp==n);return{n,c:a.length,rev:sum(a.map(c=>c.spend)),rep:a.length?a.filter(c=>c.n>=2).length/a.length:0}}),inp=(k,i)=>`<input style="width:70px" type="number" value="${S.rfm[k][i]}" onchange="S.rfm['${k}'][${i}]=+this.value;render()">`;
return`<h2>Customer Value & RFM Analysis</h2><div class="note">RFM groups are fixed business rules on configurable thresholds. They are separate from the K-means behavioral clusters.</div><div class="card"><h3>Thresholds (score 1–4)</h3>Recency days ≤ ${[0,1,2].map(i=>inp('r',i)).join('')} · Orders ≥ ${[0,1,2].map(i=>inp('f',i)).join('')} · Spend ≥ ${[0,1,2].map(i=>inp('m',i)).join('')}</div>
<div class="g"><div class="card"><h3>Customers by RFM group</h3>${bars(g.map(x=>[x.n,x.c]),f0)}</div><div class="card"><h3>Revenue by RFM group</h3>${bars(g.map(x=>[x.n,x.rev]),cur)}</div></div><div class="card">${tbl(['Group','Customers','Revenue','Repeat rate'],g.map(x=>[x.n,f0(x.c),cur(x.rev),pc(x.rep)]))}<p>Re-engagement needed (At-Risk + Lost): ${f0(g[3].c+g[4].c)} customers.</p></div>`};
const recs=A=>A.map(s=>{const p=PB[s.key];return{seg:s.name,ev:evid(s),obj:p.obj,camp:p.camp,ch:p.ch,pri:p.pri,met:p.met,lim:p.lim}});
P.st=(V,A)=>`<h2>Marketing Strategy Recommendations</h2>${recs(A).map(r=>`<div class="card"><h3>${r.seg} — ${r.pri} priority</h3><p><b>Evidence:</b> ${r.ev}</p><p><b>Objective:</b> ${r.obj}</p><p><b>Campaign:</b> ${r.camp}</p><p><b>Channel:</b> ${r.ch} · <b>Success metric:</b> ${r.met}</p><p><b>Limitations:</b> ${r.lim}. Outcomes are not guaranteed; validate with a controlled test.</p></div>`).join('')}${qa()}`;
function qa(){return`<div class="card nf"><h3>Ask the data (local rule-based engine, not an LLM)</h3><input id="qi" style="width:60%" placeholder="e.g. Which segment contributes the most revenue?"><button class="b" onclick="$('#qo').innerHTML=ans($('#qi').value)">Ask</button><div id="qo"></div></div>`}
function ans(q){q=q.toLowerCase();const V=view(),A=agg(V);if(!A.length)return'No data available.';const top=(f)=>[...A].sort((a,b)=>f(b)-f(a))[0];let r;
if(/revenue/.test(q)){const s=top(x=>x.rev);r=`${s.name} contributes the most revenue (${cur(s.rev)}, ${pc(s.rs)}). `+evid(s)}
else if(/discount/.test(q)){const s=top(x=>x.dr),c=V.C.filter(x=>x.n>=3).sort((a,b)=>b.dr-a.dr).slice(0,5);r=`${s.name} is most discount-sensitive (${pc(s.dr)} of orders discounted). Top customers (≥3 orders): ${c.map(x=>x.id+' '+pc(x.dr)).join(', ')}.`}
else if(/declin|engagement/.test(q)){const s=[...A].filter(x=>x.eng!=null).sort((a,b)=>a.eng-b.eng)[0];r=s?`${s.name} has the lowest engagement score (${f0(s.eng)}) and average recency ${f0(s.rec)} days. Engagement trend over time is not in this data, so "declining" cannot be measured directly.`:'Engagement data is unavailable.'}
else if(/loyal|high-value|high value/.test(q)){const s=A.find(x=>x.key=='loyal')||A[0],p=PB[s.key];r=`${evid(s)}. Suggested: ${p.camp} via ${p.ch}; ${p.fq}. Limitation: ${p.lim}.`}
else if(/re-?engage|inactive|win/.test(q)){const n=V.C.filter(c=>c.grp=='At-Risk'||c.grp=='Lost');r=`${f0(n.length)} customers are RFM At-Risk or Lost. Segments: ${[...new Set(n.map(c=>c.seg))].join(', ')}.`}
else if(/categor|product/.test(q))r=A.map(s=>`${s.name}: ${s.top}`).join('<br>');
else r='Supported topics: revenue, discount sensitivity, engagement, high-value marketing, re-engagement, categories. Other information is unavailable in this dataset.';return`<p>${r}</p><small>Source: local rule-based engine using the currently filtered data.</small>`}
// ---------- simulator
function simVals(A){const s=A.find(x=>x.name==S.sim.seg)||A[0],d=S.sim;if(!d.init||d.seg!=s.name){Object.assign(d,{init:1,seg:s.name,budget:5000,tg:s.n,resp:5,conv:20,aov:Math.round(s.aov),mg:35,cost:2,up:1.3,cm:1.2});}return s}
function sc(d){const out=[{n:'No Campaign',r:0,c:0,v:0,rev:0,gp:0,cost:0,net:0,roi:null}];[['Standard',1,1],['Targeted Personalized',d.up,d.cm]].forEach(([n,u,m])=>{const cpc=d.cost*m,t=cpc>0?Math.min(d.tg,Math.floor(d.budget/cpc)):d.tg,r=t*Math.min(1,d.resp/100*u),c=r*d.conv/100,rev=c*d.aov,gp=rev*d.mg/100,cost=t*cpc;out.push({n,t,r,c,rev,gp,cost,net:gp-cost,roi:cost?(gp-cost)/cost:null})});return out}
P.sm=(V,A)=>{const s=simVals(A),d=S.sim,x=(k,l,st)=>`<label>${l}<br><input type="number" step="${st||1}" value="${d[k]}" onchange="S.sim['${k}']=+this.value;render()"></label>`;
return`<h2>Campaign Simulator</h2><div class="card"><label>Segment<br><select onchange="S.sim.seg=this.value;S.sim.init=0;render()">${A.map(a=>`<option ${a.name==d.seg?'selected':''}>${a.name}</option>`).join('')}</select></label> ${x('budget','Budget ($)')}${x('tg','Customers targeted')}${x('resp','Response rate %','.5')}${x('conv','Conversion rate % of responders','.5')}${x('aov','Avg order value ($)')}${x('mg','Gross margin %')}${x('cost','Cost / customer ($)','.1')}${x('up','Personalization response uplift ×','.1')}${x('cm','Personalization cost ×','.1')}<p>Observed (data): ${evid(s)}. Everything else above is a user assumption.</p></div>
<div class="card">${tbl(['Scenario','Targeted','Responses','Conversions','Revenue','Gross profit','Cost','Net contribution','ROI'],sc(d).map(r=>[r.n,f0(r.t||0),f1(r.r),f1(r.c),cur(r.rev),cur(r.gp),cur(r.cost),cur(r.net),r.roi==null?'n/a':pc(r.roi)]))}<p>Formulas: targeted = min(customers, budget ÷ cost per customer); responses = targeted × response; conversions = responses × conversion; revenue = conversions × AOV; gross profit = revenue × margin; net = gross profit − cost; ROI = net ÷ cost. Revenue shown is gross, not verified incremental.</p><p class="w">Estimates are assumption-driven scenarios, not validated predictions or causal effects. Validate with a controlled experiment with a holdout group.</p></div>`};
// ---------- data management
const AL={customer_id:['customer_id','customerid','cust_id','customer'],transaction_date:['transaction_date','date','order_date'],purchase_amount:['purchase_amount','amount','total','order_value'],product_category:['product_category','category'],transaction_id:['transaction_id','order_id','txn_id'],discount_applied:['discount_applied','discount','discounted'],returned:['returned','is_return'],location_region:['location_region','region'],acquisition_channel:['acquisition_channel','channel'],age_band:['age_band']};
function csvT(){return'transaction_id,customer_id,transaction_date,product_category,purchase_amount,discount_applied,returned\n'+S.T.map(t=>[t.id,t.cid,t.date,t.cat,t.amt,t.disc,t.ret].join(',')).join('\n')}
function csvC(){const V=view();return'customer_id,segment,rfm_group,orders,total_spend,avg_order_value,recency_days,discount_rate,return_rate,engagement,region,channel\n'+V.C.map(c=>[c.id,c.seg,c.grp,c.n,c.spend,c.aov.toFixed(2),c.rec,c.dr.toFixed(3),c.rr.toFixed(3),c.eng==null?'':c.eng.toFixed(1),c.region,c.channel].join(',')).join('\n')}
function up(file){Papa.parse(file,{header:true,skipEmptyLines:true,complete:r=>{const hd=r.meta.fields.map(h=>h.trim().toLowerCase().replace(/\s+/g,'_')),map={};for(const k in AL)map[k]=r.meta.fields[hd.findIndex(h=>AL[k].includes(h))];
const miss=['customer_id','transaction_date','purchase_amount'].filter(k=>!map[k]);if(miss.length){S.pend={err:'Missing required columns: '+miss.join(', ')+'. Detected headers: '+r.meta.fields.join(', ')};render();return}
const seen=new Set(),T=[],info={};let bad=0,dup=0,n=0;const why={};r.data.forEach((row,i)=>{const g=k=>map[k]?String(row[map[k]]??'').trim():'',amt=+g('purchase_amount'),dt=g('transaction_date'),id=g('customer_id');let e=null;
if(!id)e='empty customer_id';else if(!(amt>0))e='non-positive or non-numeric amount';else if(isNaN(Date.parse(dt)))e='invalid date';
const tid=g('transaction_id')||('U'+(i+1));if(!e&&seen.has(tid)){e='duplicate transaction_id';dup++}if(e){bad++;why[e]=(why[e]||0)+1;return}seen.add(tid);const tf=v=>/^(1|true|yes|y)$/i.test(v)?1:0;
T.push({id:tid,cid:id,date:new Date(dt).toISOString().slice(0,10),cat:g('product_category')||'Uncategorized',amt,disc:tf(g('discount_applied')),ret:tf(g('returned'))});if(!info[id])info[id]={...NI,region:g('location_region')||'Unknown',channel:g('acquisition_channel')||'Unknown',age:g('age_band')||'Unknown'}});
S.pend={T,info,total:r.data.length,bad,dup,why,prev:r.data.slice(0,5),cols:r.meta.fields}; render()}})}
P.dm=()=>{const p=S.pend;return`<h2>Data Management</h2><div class="card"><p>Loaded: <b>${f0(S.T.length)}</b> transactions, <b>${f0(S.all.length)}</b> customers (${S.src||'synthetic sample, seed 20261028'}).</p><button class="b" onclick="dl('transactions.csv',csvT())">Download loaded data (CSV)</button><button class="b" onclick="load(...Object.values(gen()));S.src=null;S.pend=null;S.f={};render()">Restore original sample</button></div>
<div class="card"><h3>Upload transactions CSV</h3><p>Required columns: customer_id, transaction_date, purchase_amount. Optional: transaction_id, product_category, discount_applied, returned, location_region, acquisition_channel, age_band (common aliases are recognised). Interaction fields are absent in uploads and show as n/a.</p><input type="file" accept=".csv" onchange="up(this.files[0])">${p?(p.err?`<p class="er">${p.err}</p>`:`<p>Records: ${p.total} read · <b>${p.T.length} valid</b> · ${p.bad} invalid/excluded (${Object.entries(p.why).map(e=>e[0]+': '+e[1]).join('; ')||'none'}) · ${p.dup} duplicates.</p>${tbl(p.cols,p.prev.map(r=>p.cols.map(c=>r[c])))}<button class="b" ${p.T.length?'':'disabled'} onclick="S.src='uploaded file';load(S.pend.T,S.pend.info);S.pend=null;S.f={};render()">Replace dataset with valid records</button>`):''}</div>`};
// ---------- PDF
function pdf(kind){try{const{jsPDF}=window.jspdf,d=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'}),V=view(),A=agg(V),k=kp(V,A);if(!k)throw new Error('No data to export');let y=20,pg=1;
const ft=()=>{d.setFont(undefined,'normal').setFontSize(8).setTextColor(120);d.text('SegmentIQ AI · synthetic/illustrative data unless stated · Page '+pg,148,204,{align:'center'})},np=()=>{ft();d.addPage();pg++;y=20};
const H=t=>{if(y>170)np();d.setFont(undefined,'bold').setFontSize(15).setTextColor(11,37,69);d.text(t,14,y);y+=8},Pp=(t,s=10)=>{d.setFont(undefined,'normal').setFontSize(s).setTextColor(40);for(const l of d.splitTextToSize(t,268)){if(y>192)np();d.text(l,14,y);y+=s*.45}y+=2};
const Bc=(rows,fm)=>{const m=Math.max(...rows.map(r=>r[1]),1e-9);rows.forEach(([l,v])=>{if(y>192)np();d.setFont(undefined,'normal').setFontSize(9).setTextColor(40);d.text(String(l).slice(0,38),14,y);d.setFillColor(15,143,160);d.rect(78,y-3,Math.max(.5,v/m*150),3.5,'F');d.text(fm(v),234,y);y+=6});y+=3};
const Tb=(h,rows)=>{const w=268/h.length,row=(r,b)=>{if(y>192){np();}d.setFont(undefined,b?'bold':'normal').setFontSize(8).setTextColor(40);r.forEach((c,i)=>d.text(String(c).slice(0,Math.floor(w/1.6)),14+i*w,y));y+=5.5};row(h,1);rows.forEach(r=>row(r,0));y+=3};
const fl=Object.entries(S.f).filter(e=>e[1]).map(e=>e.join('=')).join(', ')||'none';
d.setFillColor(11,37,69);d.rect(0,0,297,210,'F');d.setTextColor(255);d.setFontSize(34).setFont(undefined,'bold');d.text('SegmentIQ AI',20,80);d.setFontSize(16).setFont(undefined,'normal');d.text('Customer Intelligence & Behavioral Segmentation',20,92);d.text('Understand Behavior. Discover Segments. Personalize Growth.',20,102);d.setFontSize(11);d.text('Report generated: '+new Date().toISOString().slice(0,10)+' · Report: '+kind,20,125);d.text('Filters: '+fl,20,133);d.text(S.src?'Data: '+S.src:'Data: synthetic sample dataset (seed 20261028)',20,141);d.text(d.splitTextToSize('Prototype demonstration — customer records, segment profiles, and campaign recommendations use illustrative sample data unless otherwise stated.',250),20,155);
d.addPage();pg++;y=20;const all=kind=='full';
if(all||kind=='exec'){H('Executive summary');const t=A[0];Pp(`${f0(k.t)} customers in ${k.ns} behavioral segments. ${t.name} contributes the most revenue (${pc(t.rs)}). Repeat purchase rate is ${pc(k.rep)}; ${pc(k.rk)} of customers are RFM At-Risk or Lost. Segments are found with K-means (k=${S.k}) on behavioral features, not demographics.`);
H('KPI summary and definitions');Tb(['KPI','Value','Definition'],[['Total customers',f0(k.t),'Customers with ≥1 transaction under current filters'],['Segments',k.ns,'Distinct K-means segments present'],['Avg customer value',cur(k.av),'Total spend ÷ customers'],['Repeat rate',pc(k.rep),'Customers with ≥2 orders'],['High-value share',pc(k.hv),'Top 20% by spend'],['At-risk share',pc(k.rk),'RFM At-Risk + Lost']]);
H('Revenue contribution by segment');Bc(A.map(s=>[s.name,s.rev]),cur)}
if(all){np();H('Segmentation methodology');Pp(`K-means (k-means++ init, seed 42) on z-scored: ${FE.join(', ')}. Frequency and spend log-transformed; missing engagement mean-imputed. IDs and demographics excluded. Names derive from centroid rules. RFM groups are separate rule-based thresholds (R ≤ ${S.rfm.r.join('/')} days, F ≥ ${S.rfm.f.join('/')} orders, M ≥ ${S.rfm.m.join('/')} spend).`);
H('Segment distribution and comparison');Bc(A.map(s=>[s.name,s.n]),f0);Bc(A.map(s=>[s.name+' AOV',s.aov]),cur);Tb(['Segment','Cust','Rev','AOV','Orders','Recency','Disc','Eng'],A.map(s=>[s.name,f0(s.n),cur(s.rev),cur(s.aov),f1(s.fq),f0(s.rec),pc(s.dr),s.eng==null?'n/a':f0(s.eng)]))}
if(all||kind=='seg'){if(all)np();H('Segment profiles');A.forEach(s=>{Pp(evid(s)+'. Top categories: '+s.top+'. Distinguishing: '+dist(s)+'. Hypothesis (unvalidated): '+PB[s.key].hyp+'.')})}
if(all){H('RFM analysis');const G=['Champions','Loyal / Active','Potential / Low-Engagement','At-Risk','Lost'];Tb(['Group','Customers','Revenue'],G.map(n=>{const a=V.C.filter(c=>c.grp==n);return[n,f0(a.length),cur(sum(a.map(c=>c.spend)))]}))}
if(all||kind=='rec'){H('Differentiated marketing recommendations');recs(A).forEach(r=>Pp(`${r.seg} [${r.pri}] — Evidence: ${r.ev}. Objective: ${r.obj}. Campaign: ${r.camp}. Channel: ${r.ch}. Metric: ${r.met}. Limitations: ${r.lim}; no guaranteed outcome.`))}
if(all){const s=simVals(A);H('Campaign simulator scenario');Pp(`Segment ${s.name}. Assumptions (user inputs): budget ${cur(S.sim.budget)}, targeted ${S.sim.tg}, response ${S.sim.resp}%, conversion ${S.sim.conv}%, AOV ${cur(S.sim.aov)}, margin ${S.sim.mg}%, cost/customer $${S.sim.cost}.`);Tb(['Scenario','Revenue','Gross profit','Cost','Net','ROI'],sc(S.sim).map(r=>[r.n,cur(r.rev),cur(r.gp),cur(r.cost),cur(r.net),r.roi==null?'n/a':pc(r.roi)]));
H('Limitations and next steps');Pp('Synthetic data; clusters depend on k and features; scenarios are assumptions, not predictions; interaction data is summary-level. Next: validate with holdout experiments, test alternative k, connect real CRM data.')}
ft();d.save(`segmentiq-${kind}.pdf`)}catch(e){$('#err').textContent='PDF generation failed: '+e.message;console.error(e)}}
P.xp=()=>`<h2>Export & Reports</h2><div class="card"><p>Exports use the current filters, RFM thresholds and campaign scenario. PDFs are A4 landscape, generated client-side with jsPDF.</p><button class="b" onclick="pdf('full')">Download Full Dashboard PDF</button><button class="b" onclick="pdf('exec')">Download Executive Summary PDF</button><button class="b" onclick="pdf('seg')">Download Segment Profiles PDF</button><button class="b" onclick="pdf('rec')">Download Marketing Recommendations PDF</button><button class="b" onclick="dl('customers.csv',csvC())">Download Customer Data CSV</button><button class="b" onclick="window.print()">Print-Friendly Report</button></div>`;
